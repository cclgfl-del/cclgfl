{% extends "base.html" %}

{% block title %}Search · {{ cfg.blog_name }}{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}

{% block main %}
<div class="wrap search">
  <p class="kicker">Search the blog</p>
  <form class="search__box" role="search" action="{{ url('/search/') }}" onsubmit="return false">
    <label for="q" class="visually-hidden">Search posts</label>
    <input id="q" name="q" type="search" placeholder="Search by case, statute or subject" autocomplete="off" spellcheck="false" autofocus>
  </form>
  <div class="search__filters" data-filters hidden></div>
  <p class="search__meta" data-search-meta aria-live="polite"></p>
  <ol class="rows rows--results" data-results></ol>
  <noscript><p class="search__meta">Search needs JavaScript. Every post is also listed under <a href="{{ url('/posts/') }}">All posts</a>.</p></noscript>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ asset('js/search.js') }}" defer></script>
{% endblock %}
