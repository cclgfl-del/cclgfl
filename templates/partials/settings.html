<div class="settings" id="settings" role="dialog" aria-label="Reading settings" hidden>
  <div class="settings__group">
    <p class="label" id="set-theme">Appearance</p>
    <div class="seg" role="group" aria-labelledby="set-theme">
      <button type="button" data-set="theme" data-value="auto" aria-pressed="true">Auto</button>
      <button type="button" data-set="theme" data-value="light" aria-pressed="false">Light</button>
      <button type="button" data-set="theme" data-value="sepia" aria-pressed="false">Sepia</button>
      <button type="button" data-set="theme" data-value="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
  <div class="settings__group">
    <p class="label" id="set-size">Text size</p>
    <div class="seg seg--type" role="group" aria-labelledby="set-size">
      <button type="button" data-set="size" data-value="0.92" aria-pressed="false" aria-label="Small"><span style="font-size:.82rem">A</span></button>
      <button type="button" data-set="size" data-value="1" aria-pressed="true" aria-label="Standard"><span style="font-size:1rem">A</span></button>
      <button type="button" data-set="size" data-value="1.1" aria-pressed="false" aria-label="Large"><span style="font-size:1.18rem">A</span></button>
      <button type="button" data-set="size" data-value="1.22" aria-pressed="false" aria-label="Largest"><span style="font-size:1.36rem">A</span></button>
    </div>
  </div>
  <div class="settings__group">
    <p class="label" id="set-notes">Notes</p>
    <div class="seg" role="group" aria-labelledby="set-notes">
      <button type="button" data-set="notes" data-value="margin" aria-pressed="true">In the margin</button>
      <button type="button" data-set="notes" data-value="text" aria-pressed="false">In the text</button>
    </div>
  </div>
</div>
