<footer class="site-foot">
  <div class="wrap">
    <div class="site-foot__grid">
      <div class="site-foot__brand">
        <a href="{{ url('/') }}" class="site-foot__mark" aria-label="{{ cfg.blog_name }} home">
          <img src="{{ asset('img/seal.png') }}" alt="" width="56" height="56">
          <span class="wordmark wordmark--md"><span class="wm-a">{{ cfg.centre_short }}</span><span class="wm-b">Blog</span></span>
        </a>
        <address>
          {{ cfg.centre }}<br>
          {{ cfg.university }}<br>
          {{ cfg.address }}
        </address>
      </div>
      <nav aria-label="The Blog">
        <p class="label">The Blog</p>
        <ul>
          <li><a href="{{ url('/') }}">Home</a></li>
          <li><a href="{{ url('/blogs/') }}">Blogs</a></li>
          <li><a href="{{ url('/submissions/') }}">Submissions</a></li>
          <li><a href="{{ url('/feed.xml') }}">RSS feed</a></li>
        </ul>
      </nav>
      <nav aria-label="The Centre">
        <p class="label">The Centre</p>
        <ul>
          <li><a href="{{ url('/about/') }}">About Us</a></li>
          <li><a href="{{ url('/contact/') }}">Contact Us</a></li>
          <li><a href="mailto:{{ cfg.email }}">{{ cfg.email }}</a></li>
        </ul>
      </nav>
    </div>
    <div class="site-foot__base">
      <p>&copy; {{ now.year }} {{ cfg.centre }}, {{ cfg.university }}</p>
      <p><a href="#main">Back to top ↑</a></p>
    </div>
  </div>
</footer>
