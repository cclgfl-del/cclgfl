# ─────────────────────────────────────────────────────────────────────────────
#  CCLGFL Blog — site configuration
#  Everything an editor might reasonably change lives here. The build reads
#  nothing else for names, links or rules.
# ─────────────────────────────────────────────────────────────────────────────

# Review mode: publishes the specimen posts under a "Review build" banner and
# tells search engines to index nothing, so the design can be shown before any
# real post exists. Set to false for launch.
review: true

blog_name: CCLGFL Blog
centre: Centre for Corporate Law, Governance and Financial Laws
centre_short: CCLGFL
university: National Law University Delhi
address: Sector 14, Dwarka, New Delhi 110078
email: nlud.bflr@nludelhi.ac.in

# The public address. Overridden in CI by the SITE_URL repository variable, so
# switching to the custom domain is a settings change, not a code change.
url: https://cclgfl.nludelhi.ac.in

# The submission form's public link. Until it is set, the Submissions page says
# the form will be published there.
submission_form_url: ""

# GoatCounter site code (e.g. "cclgfl" for cclgfl.goatcounter.com). Empty = no
# analytics script at all.
goatcounter: ""

description: >-
  Critical engagement with contemporary developments in corporate law,
  corporate governance, financial laws and allied areas, from the Centre for
  Corporate Law, Governance and Financial Laws at National Law University Delhi.

about:
  - >-
    The Centre for Corporate Law, Governance and Financial Laws (CCLGFL) at
    National Law University Delhi was reconstituted in 2025 as the successor to
    the Centre for Business and Financial Laws and the Centre for Corporate
    Governance. Building on the work of these two centres, CCLGFL’s mandate has
    been expanded to encompass developments in corporate law, corporate
    governance and financial laws. It promotes rigorous research, scholarship,
    and informed dialogue on legal, regulatory, and policy issues affecting
    businesses, financial markets, and corporate institutions. It seeks to
    deepen understanding of the legal and institutional frameworks governing
    modern businesses and financial systems. It also aims to serve as a think
    tank to strengthen the robustness and soundness of the corporate sector.
  - >-
    The Centre undertakes a range of academic and policy-oriented initiatives,
    including round-table conferences and discussions with policymakers,
    regulators, practitioners and other stakeholders. This facilitates
    meaningful exchange between academia and practice and contributes to
    contemporary legal and regulatory discourse.

people:
  - name: Dr. Aparajita Bhatt
    role: Centre Director
    photo: aparajita-bhatt.jpg
  - name: Dr. Abha Yadav
    role: Co-Director
    photo: abha-yadav.jpg

# The areas the Blog primarily covers — listed on the home and About Us pages.
# The Blog is organised by date, not by area, so these are not tags on posts.
areas:
  - Corporate Law
  - Corporate Governance
  - Securities Laws
  - Banking and Finance Law
  - Insolvency Laws

# Blog submission rules. The figures on the Submissions page and the automatic
# screening both read these. The wording of the guidelines themselves is in
# content/pages/submissions.md.
guidelines:
  words_min: 1000
  words_max: 1500
  title_max_words: 10
  max_authors: 2
  decision_days: 30
  hyperlinks_only: true         # references as hyperlinks; no footnotes or endnotes
  filename_pattern: "Title_CCLGFL Blog"
